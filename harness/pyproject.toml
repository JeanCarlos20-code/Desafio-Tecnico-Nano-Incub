[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-harness"
version = "0.2.0"
description = "LangGraph-based neutral coding harness"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[project.scripts]
harness = "project_harness.cli:main"
project-harness = "project_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["project_harness*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
